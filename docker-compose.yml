# Full stack: `docker compose up --build` after copying .env.example to .env and filling in OPENROUTER_API_KEY.
#
# Services
#   db, redis        infrastructure
#   api              NestJS API on :3000 (serves the trials queue, but runs no trials: TRIAL_WORKER=off)
#   worker           the same image, consumes the trials queue
#   python-worker    Hermes harness worker on :8001
#   seed             loads the task catalog into the API once, then exits
#   web              the Vue UI on :5173 (nginx, /api/ proxied to the API)
#
# Host ports are set in .env (API_HOST_PORT, WEB_HOST_PORT, POSTGRES_HOST_PORT, REDIS_HOST_PORT,
# PYTHON_WORKER_HOST_PORT). Inside the stack, services reach each other by service name.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: evals
      POSTGRES_PASSWORD: evals
      POSTGRES_DB: evals
    # Host port is configurable: set POSTGRES_HOST_PORT in .env if 5432 is already used by a local Postgres.
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evals -d evals"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: Dockerfile.node
    image: agent-evals-node:local
    command: ["node", "apps/api/dist/main.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://evals:evals@db:5432/evals
      REDIS_URL: redis://redis:6379
      TRIAL_WORKER: "off"
      TRACE_DIR: /data/traces
      PORT: "3000"
    ports: ["${API_HOST_PORT:-3000}:3000"]
    # Bind-mount so traces always appear under repo data/traces/ (gitignored).
    volumes: ["./data/traces:/data/traces"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.node
    image: agent-evals-node:local
    command: ["node", "apps/api/dist/worker.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://evals:evals@db:5432/evals
      REDIS_URL: redis://redis:6379
      TRACE_DIR: /data/traces
      HERMES_WORKER_URL: http://python-worker:8001
      # Trial sandboxes are created under TMPDIR. The Hermes worker reads and writes them by the same absolute
      # path, so both services mount the same volume at /sandboxes.
      TMPDIR: /sandboxes
    volumes: ["./data/traces:/data/traces", "sandboxes:/sandboxes"]
    depends_on:
      api:
        condition: service_healthy
      python-worker:
        condition: service_healthy
    restart: unless-stopped

  seed:
    build:
      context: .
      dockerfile: Dockerfile.node
    image: agent-evals-node:local
    command: ["npx", "tsx", "scripts/seed-tasks.ts"]
    env_file: .env
    environment:
      API_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

  python-worker:
    build:
      context: ./workers/python-worker
    image: agent-evals-python-worker:local
    env_file: .env
    ports: ["${PYTHON_WORKER_HOST_PORT:-8001}:8001"]
    volumes: ["hermes:/app/.hermes-home", "sandboxes:/sandboxes"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["${WEB_HOST_PORT:-5173}:80"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  hermes:
  sandboxes:
