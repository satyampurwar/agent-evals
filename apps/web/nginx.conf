# Serves the built UI and forwards /api/... to the API with the /api prefix removed,
# the same routing as the Vite dev proxy (apps/web/vite.config.ts).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
  }

  # Vue Router history mode: any other path returns the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
