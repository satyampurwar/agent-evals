[project]
name = "agent-evals-python-worker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "turing-satyam", email = "satyam.purwar@turing.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
agent-evals-python-worker = "agent_evals_python_worker:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
